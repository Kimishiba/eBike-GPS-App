name: Build Android APK (Manual)

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Bundle React Native JS Assets for Release/Offline
        run: |
          cd android
          mkdir -p app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file ../index.ts \
            --bundle-output app/src/main/assets/index.android.bundle \
            --assets-dest app/src/main/res/

      - name: Build APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eBike-GPS-App-Standalone.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
